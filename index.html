<!DOCTYPE html>

<title>Код неисправности грузовика — расшифровка SPN/FMI и дилерских кодов | codetruck.ru</title>
<meta name="description" content="Бесплатная расшифровка кодов неисправностей грузовиков: стандарт J1939 (SPN/FMI) и заводские таблицы 12 марок. Введите код со сканера или с приборной панели.">
<meta name="theme-color" content="#070B12">

<style>
/* ============================================================
   codetruck.ru - страница расшифровки кода.
   Палитра снята с самой фотографии тягача в сумерках: небо даёт
   ночную синь и бирюзу, закат за горами - янтарь, габариты
   прицепа - красный. Отсюда же и смысл: янтарный = лампа горит,
   красный = ехать нельзя.
   ============================================================ */
:root{
  --night:#070B12;
  --dusk:#0E2434;
  --steel:#16202C;
  --ink:#EEF3F9;
  --ink-2:#9FB0C2;
  --ink-3:#61707F;
  --lamp:#FF9B3D;      /* контрольная лампа */
  --horizon:#E8894A;   /* закат за горами */
  --marker:#FF5A4E;    /* габариты прицепа - критично */
  --signal:#6FE3D3;
  --line:rgba(255,255,255,.13);
  --line-2:rgba(255,255,255,.06);
  --sans:"Segoe UI Variable Display","Segoe UI",Inter,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Mono",Consolas,"SF Mono",ui-monospace,"Roboto Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--night);color:var(--ink);
  font-family:var(--sans);font-size:17px;line-height:1.6;
  -webkit-font-smoothing:antialiased;min-height:100vh;
}

/* ---------- сцена: тягач полосой по низу ----------
   Фото вертикальное, поэтому во весь фон его тянуть нельзя: на
   широком экране кадр режется случайным куском и машина уезжает
   за текст. Вместо этого фотография живёт отдельным слоем,
   прижатым к низу сцены - тогда тягач стоит под формой при любом
   размере экрана, а верх остаётся чистым под заголовок. */
.scene{
  position:relative;isolation:isolate;overflow:hidden;
  background:var(--night);
  padding:clamp(34px,7vw,70px) 0 clamp(250px,38vw,380px);
}
.scene .photo{
  position:absolute;left:0;right:0;bottom:0;height:52%;z-index:-2;
  background:url("assets/tyagach-noch.jpg") center 76%/cover no-repeat;
  /* цвет заката и синь неба на фотографии приглушены - поднимаем */
  filter:saturate(1.35) contrast(1.08) brightness(1.1);
  /* края растворяем, чтобы полоса не читалась приклеенным прямоугольником */
  -webkit-mask-image:linear-gradient(180deg, transparent 0%, #000 26%, #000 78%, transparent 100%);
          mask-image:linear-gradient(180deg, transparent 0%, #000 26%, #000 78%, transparent 100%);
}
/* Вуаль только там, где лежит текст: верх плотный, низ почти
   открыт - там машина и небо показываются в цвете. */
.scene .veil{
  position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:
    linear-gradient(180deg,
      rgba(7,11,18,.92) 0%,
      rgba(7,11,18,.80) 30%,
      rgba(7,11,18,.52) 56%,
      rgba(7,11,18,.16) 74%,
      rgba(7,11,18,.55) 94%,
      var(--night) 100%),
    radial-gradient(105% 52% at 20% 90%, rgba(232,137,74,.30), transparent 62%),
    radial-gradient(80% 46% at 84% 6%, rgba(18,74,102,.42), transparent 66%);
}
.w{max-width:800px;margin:0 auto;padding:0 clamp(18px,5vw,28px)}

.brand{
  display:flex;align-items:center;gap:10px;
  font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;
  color:#93A6B8;margin-bottom:clamp(26px,7vw,54px);
}
.brand i{width:22px;height:1px;background:var(--lamp);flex:none;opacity:.8}

h1{
  font-size:clamp(26px,4.6vw,38px);line-height:1.16;margin:0 0 14px;
  letter-spacing:-.018em;font-weight:670;max-width:22ch;
  text-shadow:0 2px 30px rgba(7,11,18,.7);
}
h1 em{font-style:normal;color:var(--lamp);white-space:nowrap}
/* Текст тот же, но разведён на два уровня: сначала - что это за
   справочник (тише, мельче), потом - что сделать (крупнее, светлее).
   Слева тонкая янтарная нить связывает оба предложения в один блок. */
.purpose{
  position:relative;max-width:66ch;
  margin:0 0 clamp(26px,5vw,36px);padding-left:clamp(14px,2.5vw,20px);
}
.purpose::before{
  content:"";position:absolute;left:0;top:5px;bottom:5px;width:2px;border-radius:2px;
  background:linear-gradient(180deg, var(--lamp), rgba(255,155,61,.05));
}
.purpose p{margin:0;text-shadow:0 1px 16px rgba(7,11,18,.85)}
.purpose .what{
  font-size:clamp(13.5px,2vw,15px);color:#9FB2C4;line-height:1.5;
}
.purpose .what b{color:#E4EBF2;font-weight:600}
.purpose .do{
  margin-top:8px;font-size:clamp(15.5px,2.3vw,18px);line-height:1.4;
  color:#F0F5FA;font-weight:450;letter-spacing:-.005em;
}

/* ---------- сканер: главный элемент страницы ----------
   Лампа Check Engine живёт внутри поля ввода. Пока код не
   разобран - она горит янтарным, как на панели. Разобрали -
   гаснет; код критичный - становится красной. Это весь смысл
   страницы одним элементом, поэтому вокруг всё тихо. */
.scanner{
  background:linear-gradient(180deg, rgba(22,32,44,.92), rgba(10,16,24,.94));
  border:1px solid var(--line);border-radius:18px;
  padding:6px 6px 6px 8px;
  display:flex;align-items:center;gap:10px;
  box-shadow:0 24px 60px -28px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,255,255,.05);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:border-color .2s ease, box-shadow .2s ease;
}
.scanner:focus-within{
  border-color:rgba(255,155,61,.55);
  box-shadow:0 24px 60px -28px rgba(0,0,0,.95), 0 0 0 4px rgba(255,155,61,.12);
}
.lamp{
  flex:none;width:42px;height:32px;margin-left:6px;
  color:var(--lamp);filter:drop-shadow(0 0 10px rgba(255,155,61,.55));
  animation:lamp-breathe 2.6s ease-in-out infinite;
}
.lamp svg{width:100%;height:100%;display:block;fill:currentColor}
@keyframes lamp-breathe{0%,100%{opacity:.72}50%{opacity:1}}
/* лампа погасла - код разобран и он не критичный */
body.solved .lamp{
  color:#3E4B59;filter:none;animation:none;
}
/* лампа красная - ехать нельзя */
body.critical .lamp{
  color:var(--marker);filter:drop-shadow(0 0 12px rgba(255,90,78,.6));
  animation:lamp-breathe 1s ease-in-out infinite;
}
@media(prefers-reduced-motion:reduce){ .lamp{animation:none;opacity:1} }

#pf-code{
  flex:1;min-width:0;background:transparent;border:none;outline:none;color:#fff;
  font-family:var(--mono);font-size:clamp(17px,4.2vw,21px);letter-spacing:.04em;
  padding:14px 2px;
}
#pf-code::placeholder{color:#4A5765}
#pf-go{
  flex:none;cursor:pointer;border:none;border-radius:13px;
  background:linear-gradient(180deg, #FFAA55, #F2833C);
  color:#20120A;font-family:var(--sans);font-weight:700;font-size:15px;
  padding:14px 22px;
  transition:transform .18s cubic-bezier(.22,1,.36,1), filter .18s ease;
}
#pf-go:hover{transform:translateY(-1px);filter:brightness(1.07)}
#pf-go:active{transform:translateY(0)}
#pf-go:focus-visible,#pf-code:focus-visible{outline:2px solid var(--lamp);outline-offset:3px}

.filters{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}
.filters select{
  flex:1 1 150px;min-width:0;cursor:pointer;
  font-family:var(--sans);font-size:13.5px;color:var(--ink-2);
  background:rgba(12,19,28,.8);border:1px solid var(--line);border-radius:11px;
  padding:11px 12px;
  transition:border-color .18s ease,color .18s ease;
}
.filters select:hover{color:var(--ink)}
.filters select:focus{outline:none;border-color:rgba(111,227,211,.5);color:var(--ink)}
.hint{
  margin:12px 0 0;font-size:12.5px;color:#9DB0C2;line-height:1.55;
  text-shadow:0 1px 12px rgba(7,11,18,.9);
}
.hint code{
  font-family:var(--mono);font-size:12px;color:var(--signal);
  background:rgba(111,227,211,.09);border:1px solid rgba(111,227,211,.2);
  border-radius:5px;padding:1px 6px;white-space:nowrap;
}

/* ---------- результат ----------
   Ответ ложится прямо на кадр с тягачом, поэтому карточка почти
   непрозрачная и с размытием под собой - иначе текст утонет в фото. */
.out:not(:empty){margin-top:clamp(22px,4vw,30px)}
.card{
  border:1px solid var(--line);border-radius:16px;
  background:linear-gradient(180deg, rgba(16,24,34,.93), rgba(9,14,21,.95));
  padding:clamp(18px,4vw,26px);
  box-shadow:0 30px 70px -34px rgba(0,0,0,.95);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.chain{list-style:none;margin:0;padding:0}
.chain li{
  position:relative;padding:0 0 18px 32px;
  opacity:0;transform:translateY(6px);
  animation:rise .4s cubic-bezier(.22,1,.36,1) forwards;
  animation-delay:calc(var(--s,0) * 120ms);
}
@keyframes rise{to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){ .chain li{animation:none;opacity:1;transform:none} }
.chain li:last-child{padding-bottom:0}
.chain li::before{content:"";position:absolute;left:8px;top:17px;bottom:-1px;width:1px;background:var(--line)}
.chain li:last-child::before{display:none}
.chain li i{
  position:absolute;left:3px;top:5px;width:11px;height:11px;border-radius:50%;
  background:var(--night);border:2px solid var(--ink-3);
}
.chain li.ok i{border-color:var(--signal);box-shadow:0 0 0 4px rgba(111,227,211,.14)}
.chain li.hit i{border-color:var(--marker);box-shadow:0 0 0 4px rgba(255,90,78,.16)}
.chain .st{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:5px;
}
.chain .tx{font-size:15.5px;color:#CBD7E3;line-height:1.5}
.chain .tx b{color:#fff;font-weight:600}
.mono{font-family:var(--mono);font-size:15px;color:var(--signal);letter-spacing:.04em}
.crit{color:var(--marker);font-weight:700}
.warn{color:var(--lamp);font-weight:700}
.miss{
  padding:15px 17px;border-left:3px solid var(--lamp);border-radius:0 12px 12px 0;
  background:rgba(28,20,12,.88);font-size:14.5px;color:#DCE5EE;line-height:1.55;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.miss + .card,.card + .miss{margin-top:12px}

/* Распечатать разбор - в мастерской бумажку кладут к машине.
   Кнопка закреплена в правом верхнем углу страницы: её видно сразу,
   не нужно искать под ответом. */
.print-btn{
  position:fixed;top:clamp(14px,2.5vw,22px);right:clamp(14px,2.5vw,22px);z-index:20;
  display:inline-flex;align-items:center;gap:8px;cursor:pointer;
  font-family:var(--sans);font-size:14px;font-weight:650;color:#20120A;
  background:linear-gradient(180deg, #FFAA55, #F2833C);
  border:none;border-radius:12px;padding:11px 17px;
  box-shadow:0 10px 26px -10px rgba(255,147,80,.65);
  transition:transform .18s cubic-bezier(.22,1,.36,1), filter .18s ease, box-shadow .18s ease;
}
.print-btn:hover{transform:translateY(-1px);filter:brightness(1.07);box-shadow:0 14px 32px -10px rgba(255,147,80,.8)}
.print-btn:active{transform:translateY(0)}
.print-btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
.print-btn svg{width:17px;height:17px;flex:none}
/* пока код не разобран - печатать нечего: кнопка гаснет в тихий контур */
.print-btn[disabled]{
  cursor:default;background:rgba(12,19,28,.72);color:var(--ink-3);
  border:1px solid var(--line);padding:10px 16px;box-shadow:none;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.print-btn[disabled]:hover{transform:none;filter:none;box-shadow:none}
@media(max-width:560px){
  .print-btn span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .print-btn{padding:10px}
  /* На узком экране плашки языка и печати по высоте не помещаются
     над строкой бренда - опускаем сцену ниже, чтобы не наезжало. */
  .scene{padding-top:64px}
  /* Два select в ряд на телефоне не влезают - текст обрезается
     стрелкой. Ставим их друг под другом на всю ширину. */
  .filters{flex-direction:column}
  .filters select{flex:1 1 auto}
}

/* Переключатель языка - зеркало кнопки печати, только слева и
   тише: это не действие, а настройка, поэтому нейтральный тёмный
   вид вместо янтарного. */
.lang-switch{
  position:fixed;top:clamp(14px,2.5vw,22px);left:clamp(14px,2.5vw,22px);z-index:20;
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(12,19,28,.72);border:1px solid var(--line);border-radius:12px;
  padding:9px 11px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.lang-switch svg{width:15px;height:15px;flex:none;color:var(--ink-3)}
.lang-switch select{
  appearance:none;-webkit-appearance:none;-moz-appearance:none;
  background:transparent;border:none;outline:none;
  color:var(--ink-2);font-family:var(--sans);font-size:13px;font-weight:650;
  letter-spacing:.03em;cursor:pointer;
}
.lang-switch select:hover{color:var(--ink)}
.lang-switch select:focus-visible{outline:2px solid var(--lamp);outline-offset:3px}
.lang-switch select option{background:#0E1620;color:#EEF3F9}
.datanote{
  display:none;margin:10px 0 0;font-size:12px;color:#8FA2B4;line-height:1.5;
  text-shadow:0 1px 12px rgba(7,11,18,.9);
}

/* ---------- печать: чистый лист, без фона и без органов управления ---------- */
@media print{
  body{background:#fff;color:#000}
  .scene .photo,.scene .veil,.filters,.hint,.datanote,.print-btn,.lang-switch,#pf-go{display:none}
  .scene{padding:0 0 14px;background:#fff}
  .brand{color:#000;margin-bottom:10px}
  .brand i{background:#000}
  h1{font-size:19px;color:#000;text-shadow:none;margin-bottom:6px}
  h1 em{color:#000}
  .purpose{display:none}
  .scanner{
    background:none;border:none;box-shadow:none;padding:0;backdrop-filter:none;
  }
  .lamp{display:none}
  #pf-code{color:#000;font-size:16px;padding:0}
  .out{padding-top:8px}
  .card{background:#fff;border:1px solid #bbb;color:#000}
  .chain li{opacity:1;transform:none;animation:none}
  .chain li::before{background:#ccc}
  .chain li i{background:#fff;border-color:#888}
  .chain .st{color:#666}
  .chain .tx{color:#000}
  .chain .tx b{color:#000}
  .mono{color:#000}
  .crit,.warn{color:#000}
  .miss{background:#f4f4f4;border-left-color:#888;color:#000}
  .foot{color:#444;padding-top:12px}
}

.foot{
  max-width:660px;margin:0 auto;padding:26px clamp(18px,5vw,28px) 70px;
  font-size:13px;color:var(--ink-3);line-height:1.6;
}
</style>

<script>
(function(){
  'use strict';

  var sel   = document.getElementById('pf-brand');
  var std   = document.getElementById('pf-standard');
  var input = document.getElementById('pf-code');
  var go    = document.getElementById('pf-go');
  var out   = document.getElementById('pf-out');
  var langSelect = document.getElementById('pf-lang');
  var dataNote   = document.getElementById('pf-datanote');

    if(currentLang !== 'ru' && BRAND_OVERRIDE[key]) return BRAND_OVERRIDE[key];
    return DB.brandNames[key];
  }
  function fmiText(fmi){
    var tbl = FMI_I18N[currentLang];
    if(tbl && tbl[fmi] != null) return tbl[fmi];
    return DB.fmi[String(fmi)];
  }

  function fillBrands(){
    if(!DB || !DB.brandNames) return;
    var prevValue = sel.value;
    while(sel.options.length > 1) sel.removeChild(sel.lastChild);
    var names = DB.brandNames;
    Object.keys(names).sort(function(a, b){
      return brandName(a).localeCompare(brandName(b), currentLang === 'ru' ? 'ru' : currentLang);
    }).forEach(function(k){
      var o = document.createElement('option');
      o.value = k; o.textContent = brandName(k);
      sel.appendChild(o);
    });
    sel.value = prevValue;
  }

  function applyLang(lang){
    if(!I18N[lang]) lang = 'ru';
    currentLang = lang;
    try{ localStorage.setItem(LANG_KEY, lang); }catch(e){}
    document.documentElement.lang = lang;
    document.title = t('pageTitle');
    var metaDesc = document.querySelector('meta[name="description"]');
    if(metaDesc) metaDesc.setAttribute('content', t('metaDescription'));
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      el.innerHTML = t(el.getAttribute('data-i18n'));
    });
    dataNote.style.display = lang === 'ru' ? 'none' : 'block';
    langSelect.value = lang;
    if(DB) fillBrands();
    printBtn.title = printBtn.disabled ? t('printTitleDisabled') : t('printTitleEnabled');
    if(input.value.trim()) run();
  }

  function load(){
    if(DB) return Promise.resolve(DB);
    if(window.__TDP_DTC){
      DB = window.__TDP_DTC; fillBrands();
      return Promise.resolve(DB);
    }
    if(loading) return loading;
    loading = new Promise(function(resolve, reject){
      var t = document.createElement('script');
      t.src = 'assets/dtc.enc.js'; t.async = true;
      t.onload = function(){
        DB = window.__TDP_DTC;
        if(!DB) return reject(new Error('пустой справочник'));
        fillBrands(); resolve(DB);
      };
      t.onerror = function(){ reject(new Error('не загрузился')); };
      document.head.appendChild(t);
    });
    return loading;
  }
  load();

  /* Нормализация написания: регистр и пробелы (в т.ч. неразрывные,
     двойные, табы) не должны влиять на распознавание кода. */
  function normCode(t){
    return t.toUpperCase().replace(/\s+/g, ' ').trim();
  }

  function parseAuto(t){
    var up = normCode(t);
    // Панель показывает код вместе с порядковым номером ошибки
    // ("2 03043-00"), поэтому ищем код с разделителем где угодно
    // в строке, а не только когда это весь ввод целиком. Слово SPN
    // необязательно ("97 FMI 3" пишут чаще, чем полную форму), а
    // между числом и словом FMI допускаем что угодно или ничего -
    // код нередко вводят слитно: "97FMI3".
    var m = up.match(/(?:SPN\s*[:\-]?\s*)?(\d{1,6})\D{0,20}FMI\s*[:\-]?\s*(\d{1,2})/);
    if(!m) m = up.match(/(\d{1,6})\s*[\/\-.,]\s*(\d{1,2})(?!\d)/);
    if(!m) m = up.match(/^(\d{1,6})\s+(\d{1,2})$/);
    if(m) return {spn:parseInt(m[1],10), fmi:parseInt(m[2],10)};
    var only = up.match(/^SPN\s*[:\-]?\s*(\d{1,6})$/) || up.match(/^(\d{1,6})$/);
    if(only) return {spn:parseInt(only[1],10), fmi:null};
    // Дилерские коды в справочнике очень разной формы: P2BA7, B000101,
    // 00100, "AA 9999", 9A9A99. Общее у них одно - короткий буквенно-
    // цифровой набор. Чисто цифровые сюда не берём: это SPN.
    if(/^[A-Z0-9]{4,8}$/.test(up.replace(/\s+/g,'')) && /[A-Z]/.test(up)){
      return {pcode:up.replace(/\s+/g,' ')};
    }
    return {bad:true};
  }

  function parse(raw, standard){
    var t = (raw || '').trim();
    if(!t) return null;
    if(standard === 'pcode') return {pcode:normCode(t)};
    if(standard === 'spnfmi'){
      var up = normCode(t);
      var m = up.match(/(?:SPN\s*[:\-]?\s*)?(\d{1,6})\D{0,20}FMI\s*[:\-]?\s*(\d{1,2})/)
           || up.match(/(\d{1,6})\s*[\/\-.,]\s*(\d{1,2})(?!\d)/)
           || up.match(/^(\d{1,6})\s+(\d{1,2})$/);
      if(m) return {spn:parseInt(m[1],10), fmi:parseInt(m[2],10)};
      var only = up.match(/^SPN\s*[:\-]?\s*(\d{1,6})$/) || up.match(/^(\d{1,6})$/);
      if(only) return {spn:parseInt(only[1],10), fmi:null};
      return {bad:true};
    }
    return parseAuto(t);
  }

  var MEANING = ['выше','ниже','превыш','обрыв','замыкан','кз ','кз.','короткое',
                 'недостовер','не поступ','отсутств','нет сигнал','неисправ',
                 'перегрев','малое','низк','высок','больше','меньше','утечк','заклин'];

  function withFmiHint(desc, fmi){
    var f = fmiText(fmi);
    if(!f) return desc;
    var low = desc.toLowerCase();
    if(desc.length > 60 && MEANING.some(function(w){ return low.indexOf(w) >= 0; })) return desc;
    return desc + ' — ' + f;
  }

  function describe(spn, fmi, brand){
    if(brand && DB.brands[brand]){
      var exact = DB.brands[brand][spn + '.' + fmi];
      if(exact) return {text:withFmiHint(exact, fmi), src:t('factorySource', {brand: brandName(brand)})};
    }
    var name = DB.spn[String(spn)]
            || (brand && DB.spnNameRu[brand] && DB.spnNameRu[brand][String(spn)])
            || (brand && DB.spnNameEn[brand] && DB.spnNameEn[brand][String(spn)])
            || DB.universal[String(spn)];
    var known = !!name;
    if(!name) name = 'SPN ' + spn;
    var f = fmiText(fmi) || t('fmiNonstandard', {fmi:fmi});
    return {text:name + ' — ' + f, src:known ? t('standardSource') : null, unknown:!known};
  }

  /* Ключи дилерских таблиц встречаются и с пробелом ("AA 9999"), и без
     него, поэтому сверяем оба написания. Индекс без пробелов строим
     один раз на таблицу и прячем от Object.keys. */
  function lookupPcode(brand, code){
    var tbl = DB.pcode[brand];
    if(!tbl) return null;
    if(tbl[code]) return tbl[code];
    var bare = code.replace(/\s+/g, '');
    if(tbl[bare]) return tbl[bare];
    if(!tbl.__bare){
      var idx = {};
      Object.keys(tbl).forEach(function(k){ idx[k.replace(/\s+/g,'')] = tbl[k]; });
      try{ Object.defineProperty(tbl, '__bare', {value:idx, enumerable:false}); }
      catch(e){ tbl.__bare = idx; }
    }
    return tbl.__bare[bare] || null;
  }

  /* Марку выбирать необязательно: если не выбрана - ищем код во всех
     дилерских таблицах и сами говорим, чья это марка. */
  function findPcode(brand, code){
    if(brand){
      var one = lookupPcode(brand, code);
      return one ? [{brand:brand, text:one}] : [];
    }
    var hits = [];
    Object.keys(DB.pcode).forEach(function(b){
      var v = lookupPcode(b, code);
      if(v) hits.push({brand:b, text:v});
    });
    return hits;
  }

  function urgent(spn, fmi, brand){
    if(DB.urgentSpn.indexOf(spn) >= 0) return true;
    if(DB.urgentFmi.indexOf(fmi) >= 0) return true;
    return brand === 'kamaz' && DB.kamazUrgent.indexOf(spn + '.' + fmi) >= 0;
  }

  function esc(t){
    return String(t).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }
  function chain(steps){
    var html = '<div class="card"><ol class="chain">';
    steps.forEach(function(s, n){
      html += '<li class="' + (s.cls||'') + '" style="--s:' + n + '"><i></i>' +
              '<div class="st">' + esc(s.st) + '</div><div class="tx">' + s.tx + '</div></li>';
    });
    return html + '</ol></div>';
  }
  function note(t){ return '<div class="miss">' + t + '</div>'; }

  var printBtn = document.getElementById('pf-print');
  printBtn.addEventListener('click', function(){
    if(!printBtn.disabled) window.print();
  });
  langSelect.addEventListener('change', function(){ applyLang(langSelect.value); });
  applyLang(currentLang);

  /* Лампа в поле ввода - индикатор состояния: горит янтарным пока
     не разобрали, гаснет на понятном коде, краснеет на критичном. */
  function setLamp(state){
    document.body.classList.remove('solved', 'critical');
    if(state) document.body.classList.add(state);
  }
  /* printable - только для разобранного кода: печатать сообщение
     «код не найден» смысла нет, поэтому кнопка гаснет. */
  function render(html, lampState, printable){
    out.innerHTML = html;
    setLamp(lampState);
    printBtn.disabled = !printable;
    printBtn.title = printable ? t('printTitleEnabled') : t('printTitleDisabled');
  }

  function run(){
    var brand = sel.value;
    var p = parse(input.value, std.value);

    if(!p){
      render(note(t('emptyPrompt')), null);
      return;
    }
    load().then(function(){
      if(p.bad){
        render(note(t('badCode')), null);
        return;
      }
      if(p.pcode){
        var hits = findPcode(brand, p.pcode);
        if(!hits.length){
          render(note(t('pcodeNotFound', {code: esc(p.pcode)})), null);
          return;
        }
        var pSteps = [{st:t('stepCode'), tx:'<span class="mono">' + esc(p.pcode) + '</span>', cls:'ok'}];
        hits.forEach(function(h){
          pSteps.push({
            st: hits.length > 1 || !brand ? brandName(h.brand) : t('stepDecoding'),
            tx: '<b>' + esc(h.text) + '</b>', cls:'ok'
          });
        });
        render(chain(pSteps), 'solved', true);
        return;
      }
      /* SPN без FMI - тоже полноценный ответ: показываем, что это за
         параметр, и разбор всех FMI по стандарту, чтобы человек нашёл
         свой случай, даже если вторую половину кода он не разглядел. */
      if(p.fmi === null){
        var nm = DB.spn[String(p.spn)]
              || (brand && DB.spnNameRu[brand] && DB.spnNameRu[brand][String(p.spn)])
              || (brand && DB.spnNameEn[brand] && DB.spnNameEn[brand][String(p.spn)])
              || DB.universal[String(p.spn)];
        if(!nm){
          render(note(t('spnNotFound', {spn: p.spn})), null);
          return;
        }
        var known = [];
        if(brand && DB.brands[brand]){
          Object.keys(DB.brands[brand]).forEach(function(k){
            var pair = k.split('.');
            if(pair[0] === String(p.spn) && pair.length === 2) known.push(pair[1]);
          });
          known.sort(function(a,b){ return a - b; });
        }
        var sSteps = [
          {st:t('stepParam'), tx:'<span class="mono">SPN ' + p.spn + '</span> — <b>' + esc(nm) + '</b>', cls:'ok'}
        ];
        if(known.length){
          sSteps.push({st:t('knownFailures', {brand: brandName(brand)}),
            tx: known.map(function(f){
              return '<span class="mono">' + p.spn + '/' + f + '</span> — ' + esc(DB.brands[brand][p.spn + '.' + f]);
            }).join('<br>'), cls:'ok'});
        }
        sSteps.push({st:t('stepNeedFmi'), tx:t('needFmiText', {spn: p.spn})});
        render(chain(sSteps), 'solved', true);
        return;
      }
      var d = describe(p.spn, p.fmi, brand);
      var u = urgent(p.spn, p.fmi, brand);
      var code = 'SPN ' + p.spn + ' · FMI ' + p.fmi;
      var steps = [
        {st:t('stepCode'), tx:'<span class="mono">' + code + '</span>', cls:'ok'},
        {st:t('stepDecoding'), tx:'<b>' + esc(d.text) + '</b>' +
           (d.src ? '<div class="st" style="margin-top:7px">' + esc(t('sourceLabel', {src:d.src})) + '</div>' : ''), cls:'ok'},
        u
          ? {st:t('stepUrgency'), tx:t('urgentText'), cls:'hit'}
          : {st:t('stepUrgency'), tx:t('notUrgentText')}
      ];
      var html = chain(steps);
      if(d.unknown){
        html += note(t('unknownSpnNote'));
      }
      render(html, u ? 'critical' : 'solved', true);
    }).catch(function(){
      render(note(t('loadError')), null);
    });
  }

  go.addEventListener('click', run);
  input.addEventListener('keydown', function(e){ if(e.key === 'Enter') run(); });
  // начали править код - лампа снова загорается: прошлый ответ уже не про этот код
  input.addEventListener('input', function(){ setLamp(null); });

})();
</script>
</body>
</html>
