name: SEO and safety audit

on:
  push:
    branches:
      - master
      - audit/safety-copy-2026-11-26
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check Worker dealer-code input normalization
        run: node scripts/test_pcode_worker_input.cjs
      - name: Check diagnostic copy
        run: python3 scripts/check_diagnostic_copy.py
      - name: Check retired-language notice links
        run: python3 scripts/check_legacy_language_links.py
      - name: Exercise legacy-language 404 rendering
        run: node scripts/test_legacy_404.cjs
      - name: Check RU index policy
        run: python3 scripts/audit_index_policy.py
      - name: Check WABCO contextual links and scope
        run: python3 scripts/test_wabco_context.py
      - name: Check code and make hub cross-links
        run: python3 scripts/test_hub_crosslinks.py
      - name: Check KamAZ and Volvo brand page scope
        run: python3 scripts/test_brand_catalog_scope.py
      - name: Check curated codes catalog copy
        run: python3 scripts/test_catalog_scope.py
      - name: Check SPN 789 and 793 content consistency
        run: python3 scripts/test_spn789_793_content.py
      - name: Check SPN 795 and 806 content consistency
        run: python3 scripts/test_spn795_806_content.py
      - name: Check SPN 799 and 802 content consistency
        run: python3 scripts/test_spn799_802_content.py
      - name: Check SPN 100 and 110 content consistency
        run: python3 scripts/test_spn100_110_content.py
      - name: Check SPN 1761 and 792 content consistency
        run: python3 scripts/test_spn1761_792_content.py
      - name: Check SPN 97 content consistency
        run: python3 scripts/test_spn97_content.py
      - name: Check SPN 91 content consistency
        run: python3 scripts/test_spn91_content.py
      - name: Test shared search URL restoration
        run: node scripts/test_shared_search_url.cjs
      - name: Test navigation link resolver
        run: python3 -m unittest discover -s scripts -p 'test_navigation_audit.py'
      - name: Inventory retired English URLs (report only)
        run: python3 scripts/audit_retired_en_urls.py
      - name: Generate SEO audit report (non-blocking findings)
        if: always()
        run: python3 scripts/audit_static_seo.py --json seo-audit-results.json
      - name: Upload audit findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-audit-truck-diag-pro-kody
          path: seo-audit-results.json
          if-no-files-found: warn
