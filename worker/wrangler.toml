name = "codetruck-pcode-api"
main = "pcode-api.js"
compatibility_date = "2026-08-10"
workers_dev = true

kv_namespaces = [
  { binding = "PCODE_KV", id = "a5664adc078746a388de8aa67520c011" }
]

# Лимит частоты по IP (см. pcode-api.js): 20 запросов в минуту.
# namespace_id выбран произвольно; отдельно создавать не нужно.
[[ratelimits]]
name = "PCODE_RL"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Лимит 50 поисков в сутки на адрес (см. DailyLimit в pcode-api.js).
# Счётчик хранится в Durable Object с SQLite - доступно на бесплатном тарифе.
[[durable_objects.bindings]]
name = "DAILY_LIMIT"
class_name = "DailyLimit"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DailyLimit"]
